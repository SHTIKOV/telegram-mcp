[project]
name = "telegram-readonly-mcp"
version = "0.1.0"
description = "Minimal read-only Telegram MCP with chat allowlist"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0",
    "telethon>=1.36.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
telegram-readonly-mcp = "telegram_readonly_mcp.server:main"
telegram-readonly-login = "telegram_readonly_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_readonly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
